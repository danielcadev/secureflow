[workspace]
resolver = "3"
members = [
    "crates/secureflow-model",
    "crates/secureflow-engine-adapter",
    "crates/secureflow-secure-adapter",
    "crates/secureflow-bench-adapter",
    "crates/secureflow-ai",
    "crates/secureflow-knowledge",
    "crates/secureflow-orchestrator",
    "crates/secureflow-web",
    "crates/secureflow-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
jsonschema = { version = "0.47.0", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled", "cache"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
thiserror = "2.0.18"
toml = "1.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.13.3", default-features = false }
