name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities here. Use the private security reporting link instead."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit hash
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exclude secrets, private source, credentials, and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, private code, and personal data.
          required: true
        - label: This is not a vulnerability report.
          required: true
