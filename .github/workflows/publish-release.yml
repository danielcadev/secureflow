name: publish-release

run-name: Publish ${{ inputs.tag }} from build run ${{ inputs.build_run_id }} attempt ${{ inputs.build_run_attempt }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag approved for publication (for example, v0.3.0)
        required: true
        type: string
      build_run_id:
        description: Successful release workflow run that built and attested this tag
        required: true
        type: string
      build_run_attempt:
        description: Exact successful attempt of the approved build run
        required: true
        type: string
      artifact_id:
        description: Immutable ID of the approved retained artifact
        required: true
        type: string
      artifact_digest:
        description: SHA-256 digest reported for the approved retained artifact
        required: true
        type: string

permissions: {}

concurrency:
  group: secureflow-release-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Validate manual publication request
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BUILD_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${DISPATCH_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_REF_TYPE}" = "branch"
          test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"
          test "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}"
          test "${GITHUB_WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@refs/heads/${DEFAULT_BRANCH}"

      - name: Checkout trusted publication controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Checkout exact approved tag as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
          path: tag-source

      - name: Bind tag, trusted workflow, build attempt, and retained artifact
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          DISPATCH_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          refresh_metadata() {
            local suffix="$1"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" \
              > "${RUNNER_TEMP}/secureflow-release-run-${suffix}.json"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
              > "${RUNNER_TEMP}/secureflow-release-artifacts-${suffix}.json"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" \
              > "${RUNNER_TEMP}/secureflow-release-workflow-${suffix}.json"
          }
          test "$(git rev-parse --verify --end-of-options 'HEAD^{commit}')" = "${DISPATCH_WORKFLOW_SHA}"
          verification_ref=refs/secureflow-release-verification/remote-tag
          dispatch_ref=refs/secureflow-release-verification/dispatch-workflow
          trap 'git -C tag-source update-ref -d "${verification_ref}"; git -C tag-source update-ref -d "${dispatch_ref}"' EXIT
          git -C tag-source fetch --no-tags --force origin "refs/tags/${RELEASE_TAG}:${verification_ref}"
          git -C tag-source fetch --no-tags --force origin "${DISPATCH_WORKFLOW_SHA}:${dispatch_ref}"
          refresh_metadata bind
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/verify_release_publication.py \
            --repository tag-source \
            --repository-name "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --run-id "${BUILD_RUN_ID}" \
            --run-attempt "${BUILD_RUN_ATTEMPT}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --workflow-revision "${DISPATCH_WORKFLOW_SHA}" \
            --workflow-json "${RUNNER_TEMP}/secureflow-release-workflow-bind.json" \
            --run-json "${RUNNER_TEMP}/secureflow-release-run-bind.json" \
            --artifacts-json "${RUNNER_TEMP}/secureflow-release-artifacts-bind.json" \
            --github-output "${GITHUB_OUTPUT}"
          test ! -e target/dist

      - name: Download exact retained artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.bind.outputs.artifact_id }}
          path: target/dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          digest-mismatch: error

      - name: Verify downloaded files and archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          DISPATCH_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          refresh_metadata() {
            local suffix="$1"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" \
              > "${RUNNER_TEMP}/secureflow-release-run-${suffix}.json"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
              > "${RUNNER_TEMP}/secureflow-release-artifacts-${suffix}.json"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" \
              > "${RUNNER_TEMP}/secureflow-release-workflow-${suffix}.json"
          }
          verification_ref=refs/secureflow-release-verification/remote-tag
          dispatch_ref=refs/secureflow-release-verification/dispatch-workflow
          trap 'git -C tag-source update-ref -d "${verification_ref}"; git -C tag-source update-ref -d "${dispatch_ref}"' EXIT
          git -C tag-source fetch --no-tags --force origin "refs/tags/${RELEASE_TAG}:${verification_ref}"
          git -C tag-source fetch --no-tags --force origin "${DISPATCH_WORKFLOW_SHA}:${dispatch_ref}"
          refresh_metadata verify
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/verify_release_publication.py \
            --repository tag-source \
            --repository-name "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --run-id "${BUILD_RUN_ID}" \
            --run-attempt "${BUILD_RUN_ATTEMPT}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --workflow-revision "${DISPATCH_WORKFLOW_SHA}" \
            --workflow-json "${RUNNER_TEMP}/secureflow-release-workflow-verify.json" \
            --run-json "${RUNNER_TEMP}/secureflow-release-run-verify.json" \
            --artifacts-json "${RUNNER_TEMP}/secureflow-release-artifacts-verify.json" \
            --assets-directory target/dist \
            --release-notes-output "${RUNNER_TEMP}/secureflow-release-notes-verify.md"
          notes_file="${RUNNER_TEMP}/secureflow-release-notes-verify.md"
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/lint_release_notes.py --require-final "${notes_file}"
          tag_commit=$(git -C tag-source rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          for archive in target/dist/*.tar.gz; do
            gh attestation verify "${archive}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "${tag_commit}" \
              --deny-self-hosted-runners
          done

      - name: Stage verified draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          DISPATCH_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          refresh_metadata() {
            local suffix="$1"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" \
              > "${RUNNER_TEMP}/secureflow-release-run-${suffix}.json"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
              > "${RUNNER_TEMP}/secureflow-release-artifacts-${suffix}.json"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" \
              > "${RUNNER_TEMP}/secureflow-release-workflow-${suffix}.json"
          }
          verification_ref=refs/secureflow-release-verification/remote-tag
          dispatch_ref=refs/secureflow-release-verification/dispatch-workflow
          trap 'git -C tag-source update-ref -d "${verification_ref}"; git -C tag-source update-ref -d "${dispatch_ref}"' EXIT
          git -C tag-source fetch --no-tags --force origin "refs/tags/${RELEASE_TAG}:${verification_ref}"
          git -C tag-source fetch --no-tags --force origin "${DISPATCH_WORKFLOW_SHA}:${dispatch_ref}"
          refresh_metadata prepublish
          notes_file="${RUNNER_TEMP}/secureflow-release-notes-publish.md"
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/verify_release_publication.py \
            --repository tag-source \
            --repository-name "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --run-id "${BUILD_RUN_ID}" \
            --run-attempt "${BUILD_RUN_ATTEMPT}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --workflow-revision "${DISPATCH_WORKFLOW_SHA}" \
            --workflow-json "${RUNNER_TEMP}/secureflow-release-workflow-prepublish.json" \
            --run-json "${RUNNER_TEMP}/secureflow-release-run-prepublish.json" \
            --artifacts-json "${RUNNER_TEMP}/secureflow-release-artifacts-prepublish.json" \
            --assets-directory target/dist \
            --release-notes-output "${notes_file}"
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/lint_release_notes.py --require-final "${notes_file}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "refusing to replace an existing release: ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_commit=$(git -C tag-source rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")
          version=${RELEASE_TAG#v}
          release_name="secureflow-${version}-${tag_commit:0:12}"
          gh release create "${RELEASE_TAG}" \
            "target/dist/${release_name}.tar.gz" \
            "target/dist/${release_name}.tar.gz.sha256" \
            "target/dist/${release_name}-source.tar.gz" \
            "target/dist/${release_name}-source.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "SecureFlow ${RELEASE_TAG}" \
            --notes-file "${notes_file}"
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,body,isDraft,isPrerelease,tagName,assets \
            > "${RUNNER_TEMP}/secureflow-release-draft.json"
          refresh_metadata draft
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/verify_release_publication.py \
            --repository tag-source \
            --repository-name "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --run-id "${BUILD_RUN_ID}" \
            --run-attempt "${BUILD_RUN_ATTEMPT}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --workflow-revision "${DISPATCH_WORKFLOW_SHA}" \
            --workflow-json "${RUNNER_TEMP}/secureflow-release-workflow-draft.json" \
            --run-json "${RUNNER_TEMP}/secureflow-release-run-draft.json" \
            --artifacts-json "${RUNNER_TEMP}/secureflow-release-artifacts-draft.json" \
            --assets-directory target/dist \
            --draft-release-json "${RUNNER_TEMP}/secureflow-release-draft.json"
          git -C tag-source fetch --no-tags --force origin "refs/tags/${RELEASE_TAG}:${verification_ref}"
          remote_tag_commit=$(git -C tag-source rev-parse --verify --end-of-options "${verification_ref}^{commit}")
          test "${remote_tag_commit}" = "${tag_commit}"
          refresh_metadata final
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,body,isDraft,isPrerelease,tagName,assets \
            > "${RUNNER_TEMP}/secureflow-release-draft-final.json"
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/verify_release_publication.py \
            --repository tag-source \
            --repository-name "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --run-id "${BUILD_RUN_ID}" \
            --run-attempt "${BUILD_RUN_ATTEMPT}" \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --workflow-revision "${DISPATCH_WORKFLOW_SHA}" \
            --workflow-json "${RUNNER_TEMP}/secureflow-release-workflow-final.json" \
            --run-json "${RUNNER_TEMP}/secureflow-release-run-final.json" \
            --artifacts-json "${RUNNER_TEMP}/secureflow-release-artifacts-final.json" \
            --assets-directory target/dist \
            --draft-release-json "${RUNNER_TEMP}/secureflow-release-draft-final.json"
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
