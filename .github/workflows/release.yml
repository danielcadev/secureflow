name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify tag resolves to event commit
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}"
          head_commit=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          tag_commit=$(git rev-parse --verify --end-of-options "${GITHUB_REF}^{commit}")
          verification_ref=refs/secureflow-release-verification/remote-tag
          git fetch --no-tags --force origin "${GITHUB_REF}:${verification_ref}"
          remote_tag_commit=$(git rev-parse --verify --end-of-options "${verification_ref}^{commit}")
          test "${head_commit}" = "${GITHUB_SHA}"
          test "${tag_commit}" = "${GITHUB_SHA}"
          test "${remote_tag_commit}" = "${GITHUB_SHA}"
          git update-ref -d "${verification_ref}"

      - name: Verify tracked release notes
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "${notes_file}"
          test -s "${notes_file}"
          python3 scripts/lint_release_notes.py docs/releases
          python3 scripts/lint_release_notes.py --require-final "${notes_file}"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt

      - name: Audit Rust dependencies
        run: |
          cargo +1.92.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.92.0 audit

      - name: Build verified release bundle
        run: bash scripts/release-local.sh target/dist

      - name: Verify downloadable checksum
        run: |
          cd target/dist
          sha256sum --check *.sha256

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/*.tar.gz

      - name: Retain exact release assets for publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: secureflow-release-assets
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build-and-attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag for release notes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify tag resolves to event commit
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}"
          head_commit=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          tag_commit=$(git rev-parse --verify --end-of-options "${GITHUB_REF}^{commit}")
          verification_ref=refs/secureflow-release-verification/remote-tag
          git fetch --no-tags --force origin "${GITHUB_REF}:${verification_ref}"
          remote_tag_commit=$(git rev-parse --verify --end-of-options "${verification_ref}^{commit}")
          test "${head_commit}" = "${GITHUB_SHA}"
          test "${tag_commit}" = "${GITHUB_SHA}"
          test "${remote_tag_commit}" = "${GITHUB_SHA}"
          git update-ref -d "${verification_ref}"

      - name: Download attested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secureflow-release-assets
          path: target/dist

      - name: Reverify downloadable checksums
        run: |
          cd target/dist
          sha256sum --check *.sha256

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse --verify --end-of-options 'HEAD^{commit}')
          tag_commit=$(git rev-parse --verify --end-of-options "${GITHUB_REF}^{commit}")
          verification_ref=refs/secureflow-release-verification/remote-tag
          git fetch --no-tags --force origin "${GITHUB_REF}:${verification_ref}"
          remote_tag_commit=$(git rev-parse --verify --end-of-options "${verification_ref}^{commit}")
          test "${head_commit}" = "${GITHUB_SHA}"
          test "${tag_commit}" = "${GITHUB_SHA}"
          test "${remote_tag_commit}" = "${GITHUB_SHA}"
          git update-ref -d "${verification_ref}"
          gh release create "${GITHUB_REF_NAME}" \
            target/dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "SecureFlow ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
